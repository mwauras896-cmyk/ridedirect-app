<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideDirect - Ride Hailing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="bg-emerald-500 p-2 rounded-lg text-slate-950 font-bold">🚗</div>
            <div>
                <h1 class="font-bold text-xl tracking-tight text-white">RideDirect</h1>
                <p class="text-xs text-slate-400">Personal Ride Hailing • Till: 1620547</p>
            </div>
        </div>
        <div class="bg-emerald-950/80 border border-emerald-500/30 text-emerald-300 px-3 py-1.5 rounded-xl text-xs font-semibold">
            M-PESA Active
        </div>
    </header>

    <main class="flex-1 max-w-xl mx-auto w-full p-4 space-y-4">
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-lg font-bold">Request Your Ride</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400">Pickup Location</label>
                    <input type="text" value="Ngurubani Main Stage" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white mt-1 outline-none" />
                </div>
                <div>
                    <label class="text-xs text-slate-400">Destination</label>
                    <input type="text" value="Titanic Resort" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white mt-1 outline-none" />
                </div>
            </div>

            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="font-semibold text-sm">Standard Ride Tier</p>
                        <p class="text-xs text-slate-400">ETA: 4 min • Clean Toyota Premio</p>
                    </div>
                    <span class="font-bold text-emerald-400 text-lg">KES 350</span>
                </div>
            </div>

            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 text-xs flex justify-between items-center text-slate-300">
                <span>Payment: Lipa na M-PESA</span>
                <strong class="text-emerald-400">Till: 1620547</strong>
            </div>

            <button onclick="alert('STK Push simulated to 1620547 successfully! Driver en route.')" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg text-sm">
                Request Ride & Pay via M-PESA
            </button>
        </div>

        <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl text-center space-y-2">
            <p class="text-xs text-slate-400">Driver Mode Dashboard Status</p>
            <p class="text-sm font-semibold text-emerald-400">Online • Today's Earnings: KES 2,450</p>
        </div>
    </main>
</body>
</html>
